<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спільна практична</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#16213a;--muted:#5d6b84;--line:#dbe2ee;--brand:#2f6fdf;--brand2:#e7effd;--ok:#14804a;--okbg:#e1f4e9;--warn:#9a5b00;--warnbg:#fff1d6;--bad:#c23b3b;--badbg:#fdeaea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{height:100%}
a{color:var(--brand)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;min-height:36px}
button:hover:not(:disabled){border-color:var(--brand)}
button:focus-visible,input:focus-visible{outline:3px solid #9cc0ff;outline-offset:1px}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.ok{color:var(--ok);border-color:#a9dcc0;background:var(--okbg)}
button.sm{padding:4px 9px;min-height:30px;font-size:13px}
button.lnk{border-color:transparent;background:none;color:var(--brand);padding:2px 4px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password]{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
.center{height:100%;overflow:auto;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(420px,100%);display:grid;gap:12px;box-shadow:0 12px 34px rgba(20,40,80,.09)}
.box h1{font-size:22px;margin:0 0 4px}
.err{color:var(--bad);font-size:14px;min-height:1em}
.mu{color:var(--muted);font-size:13px}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:7px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700}
.roomcode b{font-size:17px;letter-spacing:.12em;color:var(--brand)}
.sp{flex:1}
.pill{border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.ro{background:#e9edf4;color:var(--muted)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.acting-txt{font-weight:600}
.offline{background:var(--bad);color:#fff;padding:8px 12px;font-size:14px;font-weight:600;text-align:center}
.qbox{border-color:#b9cdf3;background:#f6f9ff}
.qcur{font-size:14px}
.qlist{display:flex;flex-direction:column;gap:2px}
.qrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:2px 0}
.qrow.off .nm{color:var(--muted)}.qrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qn{text-align:center;color:var(--muted);font-weight:700}
.hand{animation:wave 1.2s ease-in-out infinite;display:inline-block}
@keyframes wave{50%{transform:rotate(-18deg)}}
.hand-btn.up{background:var(--warnbg);border-color:#f1d9a8;color:var(--warn);font-weight:700}
.qinfo{font-weight:700;color:var(--brand)}
.lookflash{position:absolute;border:4px solid #2f6fdf;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,40,90,.10);animation:lf 2.6s ease-out forwards;pointer-events:none}
@keyframes lf{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.hist{display:flex;flex-direction:column;gap:3px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:4px 2px;border-bottom:1px solid #eef1f6}
.ht{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.hn{display:flex;flex-direction:column;min-width:0;font-size:13px}
.hd{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projbar{display:none}
.app.proj .top,.app.proj .side,.app.proj .demo{display:none}
.app.proj .main{grid-template-columns:minmax(0,1fr)}
.app.proj .projbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 16px;background:#16213a;color:#fff;font-size:20px}
.projbar b{color:#9cc0ff;letter-spacing:.12em}.pr-task{font-weight:700}.pr-ed{background:#14663e;padding:4px 14px;border-radius:20px;font-weight:700}
.pr-hands{background:#9a5b00;padding:4px 12px;border-radius:20px;font-weight:700}
.demo{background:var(--warnbg);color:var(--warn);padding:6px 12px;font-size:13px;border-bottom:1px solid #f1d9a8}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
.main.noside{grid-template-columns:minmax(0,1fr)}
.stagewrap{position:relative;min-height:0;min-width:0;display:flex}
.stage{position:relative;flex:1;min-height:0;background:#fff;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.stage iframe.hidden{opacity:0;pointer-events:none;z-index:-1}
.cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cur{position:absolute;left:0;top:0;transition:left .09s linear,top .09s linear}
.cur span{position:absolute;left:14px;top:18px;color:#fff;font:600 12px/1 system-ui,sans-serif;padding:4px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:6;background:#fff}
.empty b{font-size:18px}
.side{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.tabsb{display:flex;border-bottom:1px solid var(--line)}
.tabsb button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;background:none;min-height:42px}
.tabsb button.on{border-bottom-color:var(--brand);font-weight:700}
.sbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.gl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stlist{display:flex;flex-direction:column;gap:2px}
.st{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:4px 6px;border-radius:9px}
.st:hover{background:#f4f7fc}.st.sel{background:var(--brand2)}.st.off .nm{color:var(--muted)}
.st .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st input{width:17px;height:17px;margin:0}
.st .tg{min-width:96px}
.st2{display:flex;gap:8px;align-items:center;padding:3px 0}.st2 .nm{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#c3cad6;flex:none}.dot.on{background:#2ebd6b}
.badge{font-size:12px;border-radius:12px;padding:2px 8px;background:#e9edf4;color:var(--muted);white-space:nowrap}.badge.ed{background:var(--okbg);color:var(--ok)}
.cx{color:var(--bad)}
.acting{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.chip .cb{border:0;border-radius:0;min-height:28px;padding:2px 10px;font-size:13px;background:var(--brand2)}
.chip .cb small{color:var(--muted)}
.chip .cx{border:0;border-radius:0;min-height:28px;padding:2px 8px;background:#fff}
.task{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.task.act{border-color:#9fd6b8;background:var(--okbg)}
.task .tn{font-weight:700}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:1000;pointer-events:none;width:min(560px,94vw)}
.toast{background:#1d2840;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;transition:opacity .3s,transform .3s;max-width:100%}
.toast.ok{background:#14663e}.toast.bad{background:#a12f2f}
.toast.out{opacity:0;transform:translateY(8px)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:grid;place-items:center;z-index:900;padding:16px}
.modal{background:#fff;border-radius:16px;padding:18px;width:min(460px,100%);display:grid;gap:12px;max-height:92vh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.mhead .x{min-height:32px;padding:2px 10px}
.qr svg{width:min(320px,70vw);height:auto;display:block;margin:auto}
.qrcode-big{text-align:center;font-size:34px;font-weight:800;letter-spacing:.2em;color:var(--brand)}
.me{font-weight:600}
@media (max-width:900px){
  body{overflow:auto}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(60vh,1fr) auto}
  .main.noside{grid-template-rows:1fr}
  .side{border-left:0;border-top:1px solid var(--line);max-height:50vh}
}
</style>
</head>

<div id="app"></div>

      selArr.forEach(x=>{const s=D.students[x];if(s)m[nkey(s.ln,s.fn)]=s.ln+' '+s.fn});RR('groups/g'+Date.now().toString(36)).set({name:nm.slice(0,40),m})}},'＋ Група з вибраних')));
    body.append(gbox);
    const ul=el('div',{class:'stlist'});
    if(!list.length)ul.append(el('div',{class:'mu',style:'padding:8px'},'Учні ще не підключилися. Дайте їм посилання або QR-код кімнати ',el('b',{},ROOM),'.'));
    for(const s of list){const ed=canEditIn(D.perm,s.u),act=D.acting[s.u]&&Date.now()-D.acting[s.u]<4000;
      const cb=el('input',{type:'checkbox','aria-label':'Вибрати '+s.ln+' '+s.fn});cb.checked=D.sel.has(s.u);
      cb.onchange=()=>{cb.checked?D.sel.add(s.u):D.sel.delete(s.u);renderSide()};
      ul.append(el('div',{class:'st'+(D.sel.has(s.u)?' sel':'')+(s.on?'':' off')},cb,el('span',{class:'dot'+(s.on?' on':''),title:s.on?'онлайн':'не в мережі'}),
        el('span',{class:'nm',onclick:()=>{D.sel.has(s.u)?D.sel.delete(s.u):D.sel.add(s.u);renderSide()}},s.ln+' '+s.fn,D.hands[s.u]?el('span',{class:'hand',title:'піднімає руку'},' ✋'):null,act?el('span',{class:'acting',title:'діє зараз'},' ✍️'):null),
        el('button',{class:'sm tg '+(ed?'ok':''),title:ed?'Забрати доступ':'Надати доступ',onclick:()=>{RR('perm/u/'+s.u).set(!ed);if(!ed)RR('hands/'+s.u).remove()}},ed?'✏️ виконує':'👀 дивиться'),
        el('button',{class:'sm cx',title:'Відключити учня',onclick:()=>{if(confirm('Відключити '+s.ln+' '+s.fn+'?')){RR('students/'+s.u).remove();RR('perm/u/'+s.u).remove();RR('cur/'+s.u).remove();RR('hands/'+s.u).remove()}}},'×')))}
    body.append(ul);
    if(list.some(x=>!x.on))body.append(el('button',{class:'sm lnk',onclick:()=>{list.filter(x=>!x.on).forEach(x=>{RR('students/'+x.u).remove();RR('perm/u/'+x.u).remove()})}},'🧹 Прибрати зі списку тих, хто не в мережі'))}
  function renderTasks(body){
    const inp=el('input',{type:'file',accept:'.html,.htm,text/html',multiple:true,style:'display:none'});
    inp.onchange=async()=>{for(const f of inp.files){if(f.size>3e6){toast('Файл «'+f.name+'» завеликий (понад 3 МБ).','bad');continue}
      const text=await f.text();const tid='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      try{await RR('html/'+tid).set(text);await RR('meta/'+tid).set({name:f.name.replace(/\.html?$/i,'').slice(0,80),size:text.length,at:Date.now()});toast('Завантажено: '+f.name,'ok')}
      catch(e){toast('Не вдалося зберегти: '+e.message,'bad')}}inp.value=''};
    body.append(inp,el('button',{class:'pri',onclick:()=>inp.click()},'📤 Завантажити завдання (HTML-файл)'),
      el('div',{class:'mu'},'Завдання — це звичайна HTML-сторінка (як ваші тренажери). Усі підключені бачать одну спільну копію: кожна дія того, хто має доступ, одразу видна всім.'));
    const a=D.active;
    if(a)body.append(el('div',{class:'row'},el('button',{class:'sm',onclick:()=>RR('active').set(null)},'⏹ Закрити завдання'),
      el('button',{class:'sm',onclick:()=>restart(a.tid)},'⟲ Почати заново')));
    const arr=Object.entries(D.meta).sort((x,y)=>(y[1].at||0)-(x[1].at||0));
    if(!arr.length)body.append(el('div',{class:'mu',style:'padding:6px 0'},'Ще немає завантажених завдань.'));
    for(const[tid,m]of arr){const act=a&&a.tid===tid;
      body.append(el('div',{class:'task'+(act?' act':'')},
        el('div',{class:'tn'},act?'🟢 ':'',m.name),
        el('div',{class:'mu'},Math.round((m.size||0)/1024)+' КБ'+(m.sid?' · є збережений поступ':'')),
        el('div',{class:'row'},
          act?el('span',{class:'badge ed'},'відкрито для всіх'):el('button',{class:'sm pri',onclick:()=>openTask(tid)},'▶ Відкрити для всіх'),
          m.sid?el('button',{class:'sm',onclick:()=>restart(tid)},'⟲ Почати заново'):null,
          el('button',{class:'sm',onclick:()=>{const n=(prompt('Нова назва:',m.name)||'').trim();if(n)RR('meta/'+tid+'/name').set(n.slice(0,80)).then(()=>{if(act)RR('active/name').set(n.slice(0,80))})}},'✏️'),
          el('button',{class:'sm cx',title:'Видалити',onclick:()=>delTask(tid)},'🗑'))))}}
  async function openTask(tid){const m=D.meta[tid];if(!m)return;let sid=m.sid,sat=m.sat;
    if(!sid){sid=newSid();sat=Math.floor(sNow());await RR('meta/'+tid).update({sid,sat})}
    await RR('active').set({tid,sid,at:sat,name:m.name});toast('Завдання відкрито для всіх','ok')}
  async function restart(tid){const m=D.meta[tid];if(!m)return;
    if(!confirm('Почати «'+m.name+'» заново? Усі дії в цьому завданні буде стерто для всіх.'))return;
    const old=m.sid,sid=newSid(),sat=Math.floor(sNow());
    await RR('meta/'+tid).update({sid,sat});
    if(D.active&&D.active.tid===tid)await RR('active').set({tid,sid,at:sat,name:m.name});
    if(old)RR('log/'+old).remove()}
  async function delTask(tid){const m=D.meta[tid];if(!m)return;if(!confirm('Видалити завдання «'+m.name+'» разом із поступом?'))return;
    if(D.active&&D.active.tid===tid)await RR('active').set(null);
    if(m.sid)await RR('log/'+m.sid).remove();await RR('html/'+tid).remove();await RR('meta/'+tid).remove()}
  renderSide()}

/* ================= УЧЕНЬ ================= */
async function studentMain(){
  clear();$app.append(el('div',{class:'center'},el('div',{class:'mu'},'Завантаження…')));
  try{await initBackend('s')}catch(e){return fatal(e)}
  const sv=savedStudent(),urlR=DEMO?'DEMO':(Q.get('r')||'').trim().toUpperCase();
  if(sv&&sv.auto&&sv.ln&&sv.fn&&(!urlR||sv.r===urlR))return autoJoin(sv);
  joinScreen()}
async function doJoin(r,L,F){
  let uid;
  if(DEMO){uid=sessionStorage.getItem('collab-demo-s');if(!uid){uid='S'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('collab-demo-s',uid)}}
  else{const sv=savedStudent();
    /* інший учень на тому самому пристрої отримує новий ідентифікатор (і не успадковує доступ попереднього) */
    if(BK.auth.currentUser&&sv&&(sv.ln!==L||sv.fn!==F))await BK.auth.signOut();
    if(!BK.auth.currentUser)await BK.auth.signInAnonymously();uid=BK.auth.currentUser.uid}
  ROOM=r;const o=(await RR('owner').once('value')).val();
  if(!o)return 'Кімнату з таким кодом не знайдено.';
  saveStudent({r,ln:L,fn:F,auto:true});
  studentRoom(uid,o,L,F);return null}
function autoJoin(sv){
  clear();let cancel=false;
  $app.append(el('div',{class:'center'},el('div',{class:'box'},el('h1',{},'👋 Повертаємо вас до кімнати…'),
    el('div',{},el('b',{},sv.ln+' '+sv.fn),' · кімната ',el('b',{},sv.r)),
    el('button',{class:'lnk',onclick:()=>{cancel=true;saveStudent({...sv,auto:false});joinScreen()}},'Це не я — увійти як інший учень'))));
  setTimeout(async()=>{if(cancel)return;
    try{const e=await doJoin(sv.r,sv.ln,sv.fn);if(e){saveStudent({...sv,auto:false});joinScreen(e)}}
    catch(e){console.error(e);joinScreen('Не вдалося підключитися: '+(e.message||e))}},700)}
function joinScreen(msg){
  clear();
  let room=DEMO?'DEMO':(Q.get('r')||'').trim().toUpperCase();
  const saved=savedStudent();
  const code=el('input',{type:'text',placeholder:'Код кімнати',maxlength:'8',value:room||(saved&&saved.r)||'',autocomplete:'off',style:'text-transform:uppercase;letter-spacing:.15em;font-weight:700'});
  const ln=el('input',{type:'text',placeholder:'Прізвище',autocomplete:'family-name',value:saved?saved.ln:''}),fn=el('input',{type:'text',placeholder:"Ім'я",autocomplete:'given-name',value:saved?saved.fn:''});
  const err=el('div',{class:'err'},msg||'');
  const go=async()=>{err.textContent='';const r=(room||code.value).trim().toUpperCase(),L=cap(ln.value),F=cap(fn.value);
    if(!r){err.textContent='Введіть код кімнати.';return}
    if(!NAME_OK.test(L)||!NAME_OK.test(F)){err.textContent="Введіть прізвище та ім'я українськими або латинськими літерами.";return}
    btn.disabled=true;
    try{const e=await doJoin(r,L,F);if(e){err.textContent=e;btn.disabled=false}}
    catch(e){console.error(e);err.textContent='Не вдалося підключитися: '+(e.message||e);btn.disabled=false}};
  const btn=el('button',{class:'pri',onclick:go},'Увійти');
  [code,ln,fn].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  $app.append(el('div',{class:'center'},el('div',{class:'box'},el('h1',{},'👋 Вхід до спільної практичної'),
    room?el('div',{class:'mu'},'Кімната ',el('b',{},room)):code,ln,fn,err,btn,
    el('a',{href:'?teacher'+(DEMO?'&demo':''),class:'mu'},'Вхід для вчителя'))));
  (room?(ln.value?fn:ln):code).focus()}
function studentRoom(uid,owner,L,F){
  clear();
  const D={perm:{},students:{},me:true,can:false,acting:'',hands:{},q:{}};
  const nameOf=u=>u===owner?'Вчитель':(D.students[u]?D.students[u].ln+' '+D.students[u].fn:'Учень');
  const host=el('div',{class:'stage'});
  const pill=el('span',{class:'pill ro'},'👀 Перегляд'),taskT=el('span',{class:'ttl'},'Завдання'),actingTxt=el('span',{class:'mu acting-txt'}),syncB=el('span',{class:'pill warn',style:'display:none'},'⟳');
  const side=el('div',{class:'side',style:'display:none'}),main=el('div',{class:'main noside'},el('div',{class:'stagewrap'},host),side);
  const handBtn=el('button',{class:'sm hand-btn',onclick:()=>{if(D.hands[uid])RR('hands/'+uid).remove();else{RR('hands/'+uid).set(BK.TS()).catch(e=>toast(e.message,'bad'))}}},'✋ Підняти руку');
  const qInfo=el('span',{class:'qinfo'});
  function updHand(){const up=!!D.hands[uid];handBtn.style.display=D.can?'none':'';handBtn.classList.toggle('up',up);
    handBtn.textContent=up?'✋ Опустити руку':'✋ Підняти руку';
    const order=[...Object.entries(D.hands).filter(([u])=>D.students[u]&&D.students[u].on).sort((a,b)=>a[1]-b[1]).map(x=>x[0]),
      ...(Array.isArray(D.q.l)?D.q.l:Object.values(D.q.l||{})).filter(u=>!D.hands[u]&&D.students[u]&&D.students[u].on)];
    const i=order.indexOf(uid);qInfo.textContent=D.can||i<0?'':i===0?'⏭ Ви наступний!':'У черзі: №'+(i+1)}
  const partBtn=el('button',{class:'sm',onclick:()=>{const s=side.style.display==='none';side.style.display=s?'':'none';main.classList.toggle('noside',!s);renderSide()}},'👥 Учасники');
  $app.append(el('div',{class:'app'},el('div',{class:'top'},el('span',{class:'me'},'👤 ',L+' '+F),taskT,pill,handBtn,qInfo,syncB,actingTxt,el('span',{class:'sp'}),partBtn,
    el('button',{class:'sm',title:'Перезібрати завдання',onclick:()=>stage.resync()},'⟳'),
    el('button',{class:'sm',onclick:leave},'Вийти')),connBanner(),main));
  let at={};
  const onActivity=u=>{if(u===uid)return;actingTxt.textContent='Діє: '+nameOf(u);clearTimeout(at.t);at.t=setTimeout(()=>{actingTxt.textContent=''},3500)};
  const editorsNow=()=>Object.entries(D.students).filter(([u,v])=>v&&v.on&&canEditIn(D.perm,u)).length;
  const stage=connectStage(host,{uid,canAct:()=>D.can,cursorOK:()=>editorsNow()<=5,nameOf,onActivity,onStatus:s=>{syncB.style.display=s==='sync'?'':'none'},
    onActive:a=>{taskT.textContent=a?a.name:'Очікування завдання'}});
  const meRef=RR('students/'+uid);let gone=false,connCb=null;const subs=Subs();
  if(DEMO){meRef.set({ln:L,fn:F,on:true,at:Date.now()});meRef.onDisconnect().update({on:false,at:Date.now()})}
  else{connCb=BK.fdb.ref('.info/connected').on('value',s=>{if(s.val()!==true||gone)return;
    meRef.update({ln:L,fn:F,on:true,at:BK.TS()}).then(()=>meRef.onDisconnect().update({on:false,at:BK.TS()}))
      .catch(e=>{console.warn(e);toast('Не вдалося зареєструватися в списку учнів: '+(e.message||e),'bad',8000)})})}
  let seen=false;
  subs.on(meRef,'value',s=>{const v=s.val();if(v){seen=true;return}if(seen&&!gone){gone=true;cleanup();const sv=savedStudent();if(sv)saveStudent({...sv,auto:false});joinScreen('Вас відключено від кімнати. Якщо вчитель змінив код — увійдіть за новим посиланням або QR-кодом.')}});
  const upd=()=>{const c=canEditIn(D.perm,uid);if(c!==D.can&&D.ready)toast(c?'✏️ Вчитель надав вам доступ: можете виконувати завдання!':'🔒 Доступ до виконання закрито. Ви бачите, що роблять інші.',c?'ok':'info',4500);
    D.can=c;D.ready=true;updHand();pill.className='pill '+(c?'ok':'ro');pill.textContent=c?'✏️ Ви можете виконувати завдання':'👀 Перегляд';stage.permChanged()};
  subs.on(RR('perm'),'value',s=>{D.perm=s.val()||{};upd();renderSide()});
  subs.on(RR('students'),'value',s=>{D.students=s.val()||{};renderSide();updHand()});
  subs.on(RR('hands'),'value',s=>{D.hands=s.val()||{};updHand();renderSide()});
  subs.on(RR('q'),'value',s=>{D.q=s.val()||{};updHand()});
  function renderSide(){if(side.style.display==='none')return;side.innerHTML='';
    const list=Object.entries(D.students).map(([u,v])=>({u,...v})).filter(x=>x.on&&(x.ln||x.fn)).sort((a,b)=>String(a.ln).localeCompare(String(b.ln),'uk'));
    partBtn.textContent='👥 Учасники ('+list.length+')';
    side.append(el('div',{class:'sbody'},el('div',{class:'gl'},'Онлайн: '+list.length),
      ...list.map(s=>el('div',{class:'st2'},el('span',{class:'dot on'}),el('span',{class:'nm'},s.ln+' '+s.fn,s.u===uid?' (ви)':''),D.hands[s.u]?el('span',{title:'піднімає руку'},'✋'):null,canEditIn(D.perm,s.u)?el('span',{class:'badge ed'},'✏️ виконує'):el('span',{class:'badge'},'👀')))))}
  function cleanup(){gone=true;subs.off();try{if(connCb)BK.fdb.ref('.info/connected').off('value',connCb)}catch(e){}stage.dispose()}
  async function leave(){cleanup();const sv=savedStudent();if(sv)saveStudent({...sv,auto:false});
    try{await meRef.onDisconnect().cancel();await meRef.update({on:false,at:BK.TS()});await RR('cur/'+uid).remove();await RR('hands/'+uid).remove()}catch(e){}
    if(!DEMO)try{await BK.auth.signOut()}catch(e){}
    joinScreen()}}
